<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>작가 방탈출 · 선생님</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --main: #8ab861; --main-d: #5a7738; --accent: #f0c850;
  --bg: #f5f9f0; --card: #fff; --text: #3a4a2e; --muted: #7a8a66; --line: #e3edd4;
}
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6; padding: 20px; }
h1, h2, h3 { font-family: 'Gaegu', sans-serif; color: var(--main-d); }
button { font-family: inherit; padding: 8px 14px; border: none; border-radius: 10px; background: var(--main); color: #fff; cursor: pointer; font-size: 13px; font-weight: 500; }
button:hover { opacity: .88; }
button.ghost { background: #fff; border: 1.5px solid var(--main); color: var(--main-d); }
button.warn { background: #fff; border: 1.5px solid #d08080; color: #b04040; }
input, select { font-family: inherit; padding: 9px 12px; border: 1.5px solid #d4e4b8; border-radius: 8px; font-size: 14px; background: #fff; color: var(--text); }
.hidden { display: none !important; }
.container { max-width: 1200px; margin: 0 auto; }

/* 잠금 */
.lock { max-width: 360px; margin: 80px auto; background: var(--card); border-radius: 18px; padding: 30px; text-align: center; box-shadow: 0 4px 16px rgba(120,160,90,.12); }
.lock h1 { font-size: 28px; margin-bottom: 6px; }
.lock p { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
.lock input { width: 100%; text-align: center; margin-bottom: 10px; }
.lock .err { color: #c04040; font-size: 13px; min-height: 20px; }

/* 헤더 */
.top { background: var(--card); border-radius: 16px; padding: 16px 22px; margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; box-shadow: 0 4px 16px rgba(120,160,90,.1); }
.top h1 { font-size: 26px; flex: 1; min-width: 200px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { background: #fff; color: var(--muted); border: 1.5px solid var(--line); }
.tab.on { background: var(--main); color: #fff; border-color: var(--main); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
.filters .count { font-size: 13px; color: var(--muted); }

/* 목록 + 상세 */
.layout { display: grid; grid-template-columns: 280px 1fr; gap: 14px; align-items: start; }
@media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }
.list { background: var(--card); border-radius: 14px; padding: 10px; box-shadow: 0 4px 16px rgba(120,160,90,.1); max-height: 78vh; overflow: auto; }
.item { padding: 10px 12px; border-radius: 10px; cursor: pointer; border: 1.5px solid transparent; margin-bottom: 4px; }
.item:hover { background: var(--bg); }
.item.on { background: #eef6e4; border-color: var(--main); }
.item .who { font-weight: 700; font-size: 14px; }
.item .meta { font-size: 12px; color: var(--muted); }
.empty { color: var(--muted); text-align: center; padding: 30px 10px; font-size: 14px; }
.detail { background: var(--card); border-radius: 14px; padding: 22px 26px; box-shadow: 0 4px 16px rgba(120,160,90,.1); min-height: 300px; }
.detail .head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-bottom: 12px; margin-bottom: 14px; border-bottom: 2px dashed var(--line); }
.detail .head h2 { font-size: 26px; flex: 1; min-width: 200px; }
.pill { display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: 20px; background: #eef6e4; color: var(--main-d); font-weight: 600; }
.pill.gray { background: #f0f0ea; color: #8a8a7a; }

/* 방탈출 방 카드 */
.room { border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
.room .tag { font-weight: 700; color: var(--main-d); font-size: 14px; margin-bottom: 6px; }
.room .row { display: grid; grid-template-columns: 84px 1fr; gap: 8px; font-size: 14px; margin-top: 4px; }
.room .row .k { color: var(--muted); font-size: 12.5px; padding-top: 2px; }
.room .row .v { white-space: pre-wrap; word-break: break-word; }
.room .row .v.ans { font-weight: 700; color: #b06a10; }
.room .blank { color: #c0c0b0; font-style: italic; }
.room img { max-width: 220px; max-height: 160px; border-radius: 8px; border: 2px solid var(--line); margin-top: 6px; cursor: zoom-in; }

/* 인터뷰 */
.artist-block { margin-bottom: 20px; }
.artist-block h3 { font-size: 22px; margin-bottom: 8px; }
.chat { background: #faf7f3; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; max-height: 480px; overflow: auto; }
.msg { max-width: 82%; padding: 9px 13px; border-radius: 14px; font-size: 13.5px; white-space: pre-wrap; word-break: break-word; line-height: 1.7; }
.msg.user { align-self: flex-end; background: #8b6f47; color: #fff; border-bottom-right-radius: 4px; }
.msg.assistant, .msg.artist { align-self: flex-start; background: #fff; border-bottom-left-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
.msg.system { display: none; }

/* 계정 */
table { width: 100%; border-collapse: collapse; font-size: 14px; background: var(--card); border-radius: 14px; overflow: hidden; box-shadow: 0 4px 16px rgba(120,160,90,.1); }
th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line); }
th { background: #eef6e4; color: var(--main-d); font-size: 13px; }

/* QR 인쇄 (화면에선 숨김) */
#printArea { display: none; }
.print-busy { position: fixed; inset: 0; background: rgba(255,255,255,.85); display: flex; align-items: center; justify-content: center; z-index: 100; font-size: 18px; color: var(--main-d); font-weight: 700; }
@page { size: A4; margin: 12mm; }
@media print {
  body { background: #fff; padding: 0; }
  body > *:not(#printArea) { display: none !important; }
  #printArea { display: block; }
  .pp { break-after: page; font-family: 'Noto Sans KR', sans-serif; color: #222; }
  .pp:last-child { break-after: auto; }
  .pp-head { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #333; padding-bottom: 6px; margin-bottom: 8mm; }
  .pp-head .t { font-size: 20pt; font-weight: 700; }
  .pp-head .m { font-size: 12pt; text-align: right; }
  .pp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  .pp-cell { border: 1.5px dashed #999; padding: 6mm 4mm; text-align: center; }
  .pp-cell .lb { font-size: 16pt; font-weight: 700; margin-bottom: 1mm; }
  .pp-cell .sub { font-size: 9pt; color: #555; margin-bottom: 3mm; }
  .pp-cell img.pq { width: 62mm; height: 62mm; display: block; margin: 0 auto; }
  .pp-foot { margin-top: 6mm; font-size: 10pt; color: #555; text-align: center; }
}

.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: flex; align-items: center; justify-content: center; z-index: 99; cursor: zoom-out; padding: 20px; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
</style>
</head>
<body>

<div id="lock" class="lock">
  <h1>👩‍🏫 선생님 화면</h1>
  <p>작가 방탈출 · 예술가 인터뷰 모아보기</p>
  <input id="pw" type="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter')unlock()">
  <button style="width:100%;" onclick="unlock()">열기</button>
  <div class="err" id="lockErr"></div>
</div>

<div id="main" class="container hidden">
  <div class="top">
    <h1>👩‍🏫 작가 방탈출 · 선생님 화면</h1>
    <div class="tabs">
      <button class="tab on" data-tab="escape" onclick="setTab('escape')">🗺️ 방탈출 문제</button>
      <button class="tab" data-tab="interview" onclick="setTab('interview')">🎨 예술가 인터뷰</button>
      <button class="tab" data-tab="accounts" onclick="setTab('accounts')">👤 학생 계정</button>
    </div>
  </div>
  <div class="filters">
    <select id="classSel" onchange="render()"><option value="">전체 반</option></select>
    <input id="search" placeholder="학번·이름 검색" oninput="render()">
    <span class="count" id="count"></span>
    <button id="bulkPrint" class="ghost" onclick="printFiltered()">🖨️ 보이는 학생 QR 모아 인쇄</button>
  </div>
  <div id="view"></div>
</div>

<div id="printArea"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBtSooSc-eg4zMHQ_QF-ErmYJmtaYT1Fkg",
  authDomain: "limi-88231.firebaseapp.com",
  projectId: "limi-88231",
  storageBucket: "limi-88231.firebasestorage.app",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const TEACHER_PW = '0615';

const ARTISTS = {
  gogh: { emoji: '🌻', name: '빈센트 반 고흐' },
  frida: { emoji: '🌺', name: '프리다 칼로' },
  picasso: { emoji: '🎭', name: '파블로 피카소' },
  paik: { emoji: '📺', name: '백남준' },
  warhol: { emoji: '🥫', name: '앤디 워홀' },
};
const ROOM_TAGS = ['🌀 시작방', '🔍 1번 문제', '❓ 2번 문제', '⚡ 3번 문제', '🎭 마지막방'];
const PLAY_BASE = new URL('./', location.href).href;

const state = { tab: 'escape', escape: [], interview: [], students: [], responses: {}, sel: null };
const hasQR = x => !!(x.published || x.eid);
const playUrl = (x, n = 0) => x.published ? `${PLAY_BASE}?mode=play&s=${encodeURIComponent(x.sid)}&n=${n}` : `${PLAY_BASE}?mode=play&eid=${encodeURIComponent(x.eid)}&n=${n}`;

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmt(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
// 학번 20201 → "2학년 2반"
function classOf(sid) {
  const s = String(sid);
  if (s.length === 5) return `${s[0]}학년 ${parseInt(s.slice(1, 3), 10)}반`;
  return '기타';
}

function unlock() {
  if (document.getElementById('pw').value !== TEACHER_PW) {
    document.getElementById('lockErr').textContent = '비밀번호가 달라요.'; return;
  }
  try { sessionStorage.setItem('artclassTeacher', '1'); } catch {}
  start();
}

function start() {
  document.getElementById('lock').classList.add('hidden');
  document.getElementById('main').classList.remove('hidden');
  const sortBySid = arr => arr.sort((a, b) => String(a.sid).localeCompare(String(b.sid)));
  db.collection('artclass_escape').onSnapshot(snap => { state.escape = sortBySid(snap.docs.map(d => d.data())); refreshClasses(); render(); });
  db.collection('artclass_interview').onSnapshot(snap => { state.interview = sortBySid(snap.docs.map(d => d.data())); refreshClasses(); render(); });
  db.collection('artclass_responses').onSnapshot(snap => {
    const by = {};
    snap.docs.forEach(d => { const r = d.data(); (by[r.key] = by[r.key] || []).push(r); });
    Object.values(by).forEach(a => a.sort((x, y) => x.at - y.at));
    state.responses = by; render();
  });
  db.collection('artclass_students').onSnapshot(snap => { state.students = sortBySid(snap.docs.map(d => d.data())); refreshClasses(); render(); });
}

function refreshClasses() {
  const sel = document.getElementById('classSel');
  const cur = sel.value;
  const all = new Set([...state.students, ...state.escape, ...state.interview].map(x => classOf(x.sid)));
  sel.innerHTML = '<option value="">전체 반</option>' + [...all].sort().map(c => `<option ${c === cur ? 'selected' : ''}>${c}</option>`).join('');
}

function setTab(t) {
  state.tab = t; state.sel = null;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  render();
}

function filtered(arr) {
  const c = document.getElementById('classSel').value;
  const q = document.getElementById('search').value.trim();
  return arr.filter(x => (!c || classOf(x.sid) === c) && (!q || String(x.sid).includes(q) || (x.name || '').includes(q)));
}

function render() {
  const view = document.getElementById('view');
  const bp = document.getElementById('bulkPrint');
  if (state.tab === 'escape') {
    const n = filtered(state.escape).filter(hasQR).length;
    bp.classList.remove('hidden'); bp.textContent = `🖨️ 보이는 학생 QR 모아 인쇄 (${n}명)`; bp.disabled = !n;
  } else bp.classList.add('hidden');
  if (state.tab === 'accounts') return renderAccounts(view);
  const arr = filtered(state.tab === 'escape' ? state.escape : state.interview);
  document.getElementById('count').textContent = `${arr.length}명`;
  if (state.sel && !arr.find(x => x.sid === state.sel)) state.sel = null;
  if (!state.sel && arr.length) state.sel = arr[0].sid;
  const cur = arr.find(x => x.sid === state.sel);

  view.innerHTML = `
    <div class="layout">
      <div class="list">${arr.length ? arr.map(x => `
        <div class="item ${x.sid === state.sel ? 'on' : ''}" onclick="state.sel='${esc(x.sid)}'; render();">
          <div class="who">${esc(x.sid)} ${esc(x.name)}</div>
          <div class="meta">${state.tab === 'escape' ? escapeMeta(x) : interviewMeta(x)}</div>
        </div>`).join('') : '<div class="empty">아직 아무도 없어요</div>'}
      </div>
      <div class="detail">${cur ? (state.tab === 'escape' ? escapeDetail(cur) : interviewDetail(cur)) : '<div class="empty">왼쪽에서 학생을 골라주세요</div>'}</div>
    </div>`;
}

// ---------- 방탈출 ----------
function filledCount(d) {
  const rooms = (d && d.rooms) || [];
  return rooms.filter((r, i) => r && r.story && (i === 0 || r.question) && (i === 0 || i === 4 || r.answer)).length;
}
function escapeMeta(x) {
  const d = x.data || {};
  const a = ARTISTS[d.artist];
  return `${a ? a.emoji + ' ' : ''}${esc(d.title || '(제목 없음)')} · ${filledCount(d)}/5칸 ${hasQR(x) ? '· QR ✅' : ''} · ${fmt(x.updatedAt)}`;
}
function escapeDetail(x) {
  const d = x.data || {};
  const a = ARTISTS[d.artist] || { emoji: '', name: d.artist || '' };
  const rooms = d.rooms || [];
  const row = (k, v, cls = '') => `<div class="row"><div class="k">${k}</div><div class="v ${cls}">${v ? esc(v) : '<span class="blank">비어 있음</span>'}</div></div>`;
  return `
    <div class="head">
      <h2>${a.emoji} ${esc(d.title || '(제목 없음)')}</h2>
      <span class="pill">${esc(x.sid)} ${esc(x.name)}</span>
      <span class="pill">${esc(a.name)}</span>
      <span class="pill ${filledCount(d) === 5 ? '' : 'gray'}">${filledCount(d)}/5칸</span>
      ${hasQR(x)
        ? `<a href="${esc(playUrl(x))}" target="_blank"><button class="ghost">👁️ 체험해보기</button></a>
           <button onclick="printOne('${esc(x.sid)}')">🖨️ QR 인쇄</button>`
        : '<span class="pill gray">QR 아직 안 만듦</span>'}
    </div>
    ${ROOM_TAGS.map((tag, i) => {
      const r = rooms[i] || {};
      return `<div class="room">
        <div class="tag">${tag}${r.name && !tag.endsWith(r.name) ? ' · ' + esc(r.name) : ''}</div>
        ${row(i === 0 ? '도입 이야기' : '방 설명', r.story)}
        ${r.image ? `<div class="row"><div class="k">사진</div><div class="v"><img src="${esc(r.image)}" onclick="lightbox(this.src)"></div></div>` : ''}
        ${i >= 1 && i <= 3 ? row('문제', r.question) + row('정답', r.answer, 'ans') + row('힌트', r.hint) + row('정답 문구', r.success) : ''}
        ${i === 4 ? row('마지막 질문', r.question) : ''}
      </div>`;
    }).join('')}
    ${(() => {
      const res = [...(state.responses[x.sid] || []), ...(x.eid ? state.responses[x.eid] || [] : [])];
      return `<div class="room">
        <div class="tag">💫 체험한 친구들이 마지막방에 남긴 답 (${res.length})</div>
        ${res.length ? res.map(r => `<div class="row"><div class="k">${fmt(r.at)}</div><div class="v">${esc(r.t)}</div></div>`).join('')
          : '<div class="row"><div class="k"></div><div class="v"><span class="blank">아직 없어요</span></div></div>'}
      </div>`;
    })()}
    <div style="font-size:12px; color:var(--muted); text-align:right;">마지막 저장 ${fmt(x.updatedAt)}</div>`;
}

// ---------- 인터뷰 ----------
function qCount(msgs) { return (msgs || []).filter(m => m.role === 'user').length; }
// 학생이 '대화 지우기'로 지운 대화 (작가별, 오래된 순)
function archivesOf(x, k) {
  return Object.values(x.archive || {}).filter(a => a.artist === k).sort((a, b) => a.at - b.at);
}
function totalQ(x, k) {
  return qCount((x.chats || {})[k]) + archivesOf(x, k).reduce((s, a) => s + qCount(a.msgs), 0);
}
function interviewMeta(x) {
  const parts = Object.keys(ARTISTS).filter(k => totalQ(x, k) > 0).map(k => `${ARTISTS[k].emoji}${totalQ(x, k)}`);
  return `${parts.join(' ') || '질문 없음'} · ${fmt(x.updatedAt)}`;
}
function chatHtml(msgs) {
  return `<div class="chat">${msgs.map(m => `<div class="msg ${esc(m.role)}">${esc(m.content)}</div>`).join('')}</div>`;
}
function interviewDetail(x) {
  const chats = x.chats || {};
  const used = Object.keys(ARTISTS).filter(k => totalQ(x, k) > 0);
  return `
    <div class="head">
      <h2>🎨 ${esc(x.sid)} ${esc(x.name)}</h2>
      <span class="pill">질문 ${used.reduce((s, k) => s + totalQ(x, k), 0)}개</span>
    </div>
    ${used.length ? used.map(k => `
      <div class="artist-block">
        <h3>${ARTISTS[k].emoji} ${ARTISTS[k].name} <span class="pill">질문 ${totalQ(x, k)}개</span></h3>
        ${archivesOf(x, k).map(a => `
          <div style="font-size:12px; color:var(--muted); margin:8px 0 4px;">🗑️ 학생이 지운 대화 · ${fmt(a.at)}</div>
          <div style="opacity:.75;">${chatHtml(a.msgs || [])}</div>`).join('')}
        ${qCount(chats[k]) > 0 ? `${archivesOf(x, k).length ? '<div style="font-size:12px; color:var(--muted); margin:8px 0 4px;">💬 지금 대화</div>' : ''}${chatHtml(chats[k])}` : ''}
      </div>`).join('') : '<div class="empty">아직 질문한 기록이 없어요</div>'}`;
}

// ---------- 계정 ----------
function renderAccounts(view) {
  const arr = filtered(state.students);
  document.getElementById('count').textContent = `${arr.length}명`;
  view.innerHTML = arr.length ? `
    <table>
      <tr><th>학번</th><th>이름</th><th>마지막 로그인</th><th></th></tr>
      ${arr.map(s => `<tr>
        <td>${esc(s.sid)}</td><td>${esc(s.name)}</td><td>${fmt(s.updatedAt)}</td>
        <td><button class="ghost" onclick="renameStudent('${esc(s.sid)}')">이름 고치기</button></td>
      </tr>`).join('')}
    </table>
    <p style="font-size:12.5px; color:var(--muted); margin-top:10px;">학생이 처음 들어올 때 이름을 잘못 쳤다면 여기서 고쳐주세요. 고친 이름으로 다시 들어오면 돼요.</p>` : '<div class="empty">아직 로그인한 학생이 없어요</div>';
}
async function renameStudent(sid) {
  const s = state.students.find(x => x.sid === sid);
  const name = prompt(`${sid} 학생의 이름을 무엇으로 고칠까요?`, s ? s.name : '');
  if (!name || !name.trim()) return;
  const n = name.trim();
  await db.collection('artclass_students').doc(sid).update({ name: n });
  // 이미 저장된 작업에 적힌 이름도 같이 고침
  const esc_ = db.collection('artclass_escape').doc(sid), int_ = db.collection('artclass_interview').doc(sid);
  if ((await esc_.get()).exists) await esc_.update({ name: n, 'data.maker': `${sid} ${n}` });
  if ((await int_.get()).exists) await int_.update({ name: n });
}

// ---------- QR 인쇄: 학생 한 명당 A4 한 장 (QR 4장) ----------
const QR_LABELS = ['시작방', '1번 문제', '2번 문제', '3번 문제'];
function printOne(sid) {
  const x = state.escape.find(e => e.sid === sid);
  if (x) printQRPages([x]);
}
function printFiltered() {
  const list = filtered(state.escape).filter(hasQR);
  if (!list.length) return;
  const skipped = filtered(state.escape).length - list.length;
  if (!confirm(`${list.length}명의 QR을 한 사람당 한 장씩 인쇄할까요?` +
    (skipped ? `\n(아직 "QR 생성"을 누르지 않은 ${skipped}명은 빠져요)` : ''))) return;
  printQRPages(list);
}
async function printQRPages(list) {
  if (!window.QRCodeStyling) { alert('QR 도구를 불러오지 못했어요. 새로고침 후 다시 해주세요.'); return; }
  const busy = document.createElement('div');
  busy.className = 'print-busy'; busy.textContent = 'QR 준비 중...';
  document.body.appendChild(busy);
  const area = document.getElementById('printArea');
  area.innerHTML = list.map((x, i) => {
    const d = x.published || x.data || {};
    const a = ARTISTS[d.artist] || { name: '' };
    const rooms = d.rooms || [];
    return `<div class="pp">
      <div class="pp-head">
        <div class="t">${esc(d.title || '(제목 없음)')}</div>
        <div class="m">${esc(x.sid)} ${esc(x.name)}<br>${esc(a.name)}</div>
      </div>
      <div class="pp-grid">${QR_LABELS.map((lb, n) => `
        <div class="pp-cell">
          <div class="lb">${lb}</div>
          <div class="sub">${rooms[n] && rooms[n].name && rooms[n].name !== lb ? esc(rooms[n].name) : '&nbsp;'}</div>
          <div id="pq-${i}-${n}"></div>
        </div>`).join('')}
      </div>
      <div class="pp-foot">점선을 따라 잘라 미니어처의 각 자리에 붙이세요. 마지막방은 QR이 없어요. 3번 문제를 맞히면 이어져요.</div>
    </div>`;
  }).join('');
  // QR은 하나씩 이미지로 완성한 뒤 붙임 (숨긴 영역에 바로 그리면 빈 그림이 되는 문제)
  try {
    for (let i = 0; i < list.length; i++) {
      for (let n = 0; n < 4; n++) {
        busy.textContent = `QR 준비 중... (${i + 1}/${list.length}명)`;
        const qr = new QRCodeStyling({
          // 인쇄용은 반듯한 네모 모양 (작게 뽑아도 잘 읽히게)
          width: 600, height: 600, type: 'canvas', data: playUrl(list[i], n), margin: 12,
          qrOptions: { errorCorrectionLevel: 'M' },
          dotsOptions: { color: '#000000', type: 'square' },
          cornersSquareOptions: { color: '#000000', type: 'square' },
          cornersDotOptions: { color: '#000000', type: 'square' },
          backgroundOptions: { color: '#ffffff' },
        });
        const blob = await qr.getRawData('png');
        const img = new Image();
        img.src = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
        img.className = 'pq';
        document.getElementById(`pq-${i}-${n}`).appendChild(img);
      }
    }
  } catch (e) {
    busy.remove(); alert('QR을 만들지 못했어요. 새로고침 후 다시 해주세요.'); return;
  }
  busy.remove();
  window.print();
}

function lightbox(src) {
  const box = document.createElement('div');
  box.className = 'lightbox';
  box.innerHTML = `<img src="${esc(src)}">`;
  box.onclick = () => box.remove();
  document.body.appendChild(box);
}

try { if (sessionStorage.getItem('artclassTeacher') === '1') start(); } catch {}
</script>
