<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>작가 방탈출 · 선생님</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --main: #8ab861; --main-d: #5a7738; --accent: #f0c850;
  --bg: #f5f9f0; --card: #fff; --text: #3a4a2e; --muted: #7a8a66; --line: #e3edd4;
}
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6; padding: 20px; }
h1, h2, h3 { font-family: 'Gaegu', sans-serif; color: var(--main-d); }
button { font-family: inherit; padding: 8px 14px; border: none; border-radius: 10px; background: var(--main); color: #fff; cursor: pointer; font-size: 13px; font-weight: 500; }
button:hover { opacity: .88; }
button.ghost { background: #fff; border: 1.5px solid var(--main); color: var(--main-d); }
button.warn { background: #fff; border: 1.5px solid #d08080; color: #b04040; }
input, select { font-family: inherit; padding: 9px 12px; border: 1.5px solid #d4e4b8; border-radius: 8px; font-size: 14px; background: #fff; color: var(--text); }
.hidden { display: none !important; }
.container { max-width: 1200px; margin: 0 auto; }

/* 잠금 */
.lock { max-width: 360px; margin: 80px auto; background: var(--card); border-radius: 18px; padding: 30px; text-align: center; box-shadow: 0 4px 16px rgba(120,160,90,.12); }
.lock h1 { font-size: 28px; margin-bottom: 6px; }
.lock p { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
.lock input { width: 100%; text-align: center; margin-bottom: 10px; }
.lock .err { color: #c04040; font-size: 13px; min-height: 20px; }

/* 헤더 */
.top { background: var(--card); border-radius: 16px; padding: 16px 22px; margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; box-shadow: 0 4px 16px rgba(120,160,90,.1); }
.top h1 { font-size: 26px; flex: 1; min-width: 200px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { background: #fff; color: var(--muted); border: 1.5px solid var(--line); }
.tab.on { background: var(--main); color: #fff; border-color: var(--main); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
.filters .count { font-size: 13px; color: var(--muted); }

/* 목록 + 상세 */
.layout { display: grid; grid-template-columns: 280px 1fr; gap: 14px; align-items: start; }
@media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }
.list { background: var(--card); border-radius: 14px; padding: 10px; box-shadow: 0 4px 16px rgba(120,160,90,.1); max-height: 78vh; overflow: auto; }
.item { padding: 10px 12px; border-radius: 10px; cursor: pointer; border: 1.5px solid transparent; margin-bottom: 4px; }
.item:hover { background: var(--bg); }
.item.on { background: #eef6e4; border-color: var(--main); }
.item .who { font-weight: 700; font-size: 14px; }
.item .meta { font-size: 12px; color: var(--muted); }
.grp { display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: middle; }
.grp button { padding: 1px 7px; font-size: 11px; border-radius: 6px; background: #fff; color: var(--muted); border: 1px solid #ddd; box-shadow: none; }
.grp button.on { background: var(--main); color: #fff; border-color: var(--main); }
.empty { color: var(--muted); text-align: center; padding: 30px 10px; font-size: 14px; }
.detail { background: var(--card); border-radius: 14px; padding: 22px 26px; box-shadow: 0 4px 16px rgba(120,160,90,.1); min-height: 300px; }
.detail .head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-bottom: 12px; margin-bottom: 14px; border-bottom: 2px dashed var(--line); }
.detail .head h2 { font-size: 26px; flex: 1; min-width: 200px; }
.pill { display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: 20px; background: #eef6e4; color: var(--main-d); font-weight: 600; }
.pill.gray { background: #f0f0ea; color: #8a8a7a; }

/* 방탈출 방 카드 */
.room { border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
.room .tag { font-weight: 700; color: var(--main-d); font-size: 14px; margin-bottom: 6px; }
.room .row { display: grid; grid-template-columns: 84px 1fr; gap: 8px; font-size: 14px; margin-top: 4px; }
.room .row .k { color: var(--muted); font-size: 12.5px; padding-top: 2px; }
.room .row .v { white-space: pre-wrap; word-break: break-word; }
.room .row .ed { width: 100%; box-sizing: border-box; font: inherit; font-size: 14px; padding: 6px 8px; border: 1.5px solid #d8d0c0; border-radius: 8px; resize: vertical; }
.edit-warn { background: #fff4e0; border-left: 4px solid #e8a838; padding: 8px 12px; border-radius: 8px; font-size: 13px; margin: 8px 0; }
.edit-note { font-size: 12.5px; color: var(--muted); margin: 6px 0 10px; }
.room .row .v.ans { font-weight: 700; color: #b06a10; }
.room .blank { color: #c0c0b0; font-style: italic; }
.room img { max-width: 220px; max-height: 160px; border-radius: 8px; border: 2px solid var(--line); margin-top: 6px; cursor: zoom-in; }

/* 인터뷰 */
.artist-block { margin-bottom: 20px; }
.artist-block h3 { font-size: 22px; margin-bottom: 8px; }
.chat { background: #faf7f3; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; max-height: 480px; overflow: auto; }
.msg { max-width: 82%; padding: 9px 13px; border-radius: 14px; font-size: 13.5px; white-space: pre-wrap; word-break: break-word; line-height: 1.7; }
.msg.user { align-self: flex-end; background: #8b6f47; color: #fff; border-bottom-right-radius: 4px; }
.msg.assistant, .msg.artist { align-self: flex-start; background: #fff; border-bottom-left-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
.msg.system { display: none; }

/* 계정 */
table { width: 100%; border-collapse: collapse; font-size: 14px; background: var(--card); border-radius: 14px; overflow: hidden; box-shadow: 0 4px 16px rgba(120,160,90,.1); }
th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line); }
th { background: #eef6e4; color: var(--main-d); font-size: 13px; }

/* QR 인쇄 (화면에선 숨김) */
#printArea { display: none; }
.print-busy { position: fixed; inset: 0; background: rgba(255,255,255,.85); display: flex; align-items: center; justify-content: center; z-index: 100; font-size: 18px; color: var(--main-d); font-weight: 700; }
@page { size: A4; margin: 12mm; }
@media print {
  body { background: #fff; padding: 0; }
  body > *:not(#printArea) { display: none !important; }
  #printArea { display: block; }
  .pp { break-after: page; font-family: 'Noto Sans KR', sans-serif; color: #222; }
  .pp:last-child { break-after: auto; }
  .pp-head { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #333; padding-bottom: 6px; margin-bottom: 8mm; }
  .pp-head .t { font-size: 20pt; font-weight: 700; }
  .pp-head .m { font-size: 12pt; text-align: right; }
  .pp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  .pp-cell { border: 1.5px dashed #999; padding: 6mm 4mm; text-align: center; }
  .pp-cell .lb { font-size: 16pt; font-weight: 700; margin-bottom: 1mm; }
  .pp-cell .sub { font-size: 9pt; color: #555; margin-bottom: 3mm; }
  .pp-cell img.pq { width: 62mm; height: 62mm; display: block; margin: 0 auto; }
  .pp-foot { margin-top: 6mm; font-size: 10pt; color: #555; text-align: center; }
  /* 작은 QR: 여러 학생을 한 장에 (--q = QR 한 변, --cap = 글씨 크기) */
  .ps-wrap { display: flex; flex-wrap: wrap; gap: 3mm 4mm; align-content: flex-start; font-family: 'Noto Sans KR', sans-serif; color: #222; }
  .ps { break-inside: avoid; }
  .ps-h { font-size: calc(var(--cap) + 1pt); font-weight: 700; margin-bottom: .6mm; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: calc((var(--q) + 3mm) * 3); }
  .ps-row { display: flex; }
  .ps-c { border: .8px dashed #999; padding: 1.5mm 1.5mm .6mm; text-align: center; }
  .ps-c + .ps-c { border-left: none; }
  .ps-c img.pq { width: var(--q); height: var(--q); display: block; }
  .ps-c .cap { font-size: var(--cap); line-height: 1.3; white-space: nowrap; letter-spacing: -.2px; }
}
.size-pick { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 100; }
.size-pick .box { background: #fff; border-radius: 16px; padding: 22px; width: min(360px, 92vw); box-shadow: 0 8px 30px rgba(0,0,0,.2); }
.size-pick .box p { margin: 0 0 12px; font-size: 14px; line-height: 1.6; white-space: pre-line; }
.size-pick .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.size-pick .opts button { padding: 12px 6px; font-size: 15px; }
.size-pick .opts button small { display: block; font-size: 11px; font-weight: 400; opacity: .75; margin-top: 2px; }

.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: flex; align-items: center; justify-content: center; z-index: 99; cursor: zoom-out; padding: 20px; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
</style>
</head>
<body>

<div id="lock" class="lock">
  <h1>👩‍🏫 선생님 화면</h1>
  <p>작가 방탈출 · 예술가 인터뷰 모아보기</p>
  <input id="pw" type="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter')unlock()">
  <button style="width:100%;" onclick="unlock()">열기</button>
  <div class="err" id="lockErr"></div>
</div>

<div id="main" class="container hidden">
  <div class="top">
    <h1>👩‍🏫 작가 방탈출 · 선생님 화면</h1>
    <div class="tabs">
      <button class="tab on" data-tab="interview" onclick="setTab('interview')">🎨 예술가 인터뷰</button>
      <button class="tab" data-tab="escape" onclick="setTab('escape')">🗺️ 방탈출 문제</button>
      <button class="tab" data-tab="accounts" onclick="setTab('accounts')">👤 학생 계정</button>
    </div>
  </div>
  <div class="filters">
    <select id="classSel" onchange="render()"><option value="">전체</option><option value="A">A반</option><option value="E">E반</option><option value="-">분반 안 정한 학생</option></select>
    <input id="search" placeholder="학번·이름 검색" oninput="render()">
    <span class="count" id="count"></span>
    <button id="bulkPrint" class="ghost" onclick="printFiltered()">🖨️ 보이는 학생 QR 모아 인쇄</button>
  </div>
  <div id="view"></div>
</div>

<div id="printArea"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBtSooSc-eg4zMHQ_QF-ErmYJmtaYT1Fkg",
  authDomain: "limi-88231.firebaseapp.com",
  projectId: "limi-88231",
  storageBucket: "limi-88231.firebasestorage.app",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const TEACHER_PW = '0615';

const ARTISTS = {
  gogh: { emoji: '🌻', name: '빈센트 반 고흐' },
  frida: { emoji: '🌺', name: '프리다 칼로' },
  picasso: { emoji: '🎭', name: '파블로 피카소' },
  paik: { emoji: '📺', name: '백남준' },
  warhol: { emoji: '🥫', name: '앤디 워홀' },
};
const ROOM_TAGS = ['🌀 시작방', '🔍 1번 문제', '❓ 2번 문제', '⚡ 3번 문제', '🎭 마지막방'];
const PLAY_BASE = new URL('./', location.href).href;

const state = { editing: null, tab: 'interview', groups: {}, letterGroups: {}, escape: [], interview: [], students: [], responses: {}, sel: null };
const hasQR = x => !!(x.published || x.eid);
const playUrl = (x, n = 0) => x.published ? `${PLAY_BASE}?mode=play&s=${encodeURIComponent(x.sid)}&n=${n}` : `${PLAY_BASE}?mode=play&eid=${encodeURIComponent(x.eid)}&n=${n}`;

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmt(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

// 분반(A반·E반): 선생님이 정한 값 → 없으면 아트 레터 수업에서 정한 분반을 그대로 씀
const GROUPS = ['A', 'E'];
function groupOf(sid) {
  const own = state.groups[sid];
  if (own !== undefined) return own;   // '' = 선생님이 일부러 비워 둠
  return state.letterGroups[sid] || '';
}
function setGroup(sid, g) {
  const v = groupOf(sid) === g ? '' : g;   // 같은 걸 또 누르면 해제
  db.collection('artclass_settings').doc('groups').set({ map: { [sid]: v } }, { merge: true })
    .catch(e => { console.error(e); alert('분반을 저장하지 못했어요'); });
}
function groupBtns(sid) {
  const g = groupOf(sid);
  return `<span class="grp" onclick="event.stopPropagation()">${GROUPS.map(x =>
    `<button class="${g === x ? 'on' : ''}" onclick="setGroup('${esc(sid)}','${x}')">${x}</button>`).join('')}</span>`;
}

function unlock() {
  if (document.getElementById('pw').value !== TEACHER_PW) {
    document.getElementById('lockErr').textContent = '비밀번호가 달라요.'; return;
  }
  try { sessionStorage.setItem('artclassTeacher', '1'); } catch {}
  start();
}

function start() {
  document.getElementById('lock').classList.add('hidden');
  document.getElementById('main').classList.remove('hidden');
  const sortBySid = arr => arr.sort((a, b) => String(a.sid).localeCompare(String(b.sid)));
  db.collection('artclass_escape').onSnapshot(snap => { state.escape = sortBySid(snap.docs.map(d => d.data())); render(); });
  db.collection('artclass_interview').onSnapshot(snap => { state.interview = sortBySid(snap.docs.map(d => d.data())); render(); });
  db.collection('artclass_responses').onSnapshot(snap => {
    const by = {};
    snap.docs.forEach(d => { const r = d.data(); (by[r.key] = by[r.key] || []).push(r); });
    Object.values(by).forEach(a => a.sort((x, y) => x.at - y.at));
    state.responses = by; render();
  });
  db.collection('artclass_students').onSnapshot(snap => { state.students = sortBySid(snap.docs.map(d => d.data())); render(); });
  db.collection('artclass_settings').doc('groups').onSnapshot(d => { state.groups = (d.exists && d.data().map) || {}; render(); });
  db.collection('art_letter_settings').doc('groups').onSnapshot(d => { state.letterGroups = (d.exists && d.data().map) || {}; render(); });
}

function setTab(t) {
  if (!leaveEdit()) return;
  state.tab = t; state.sel = null;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  render();
}

function filtered(arr) {
  const c = document.getElementById('classSel').value;
  const q = document.getElementById('search').value.trim();
  return arr.filter(x => (!c || groupOf(x.sid) === (c === '-' ? '' : c)) && (!q || String(x.sid).includes(q) || (x.name || '').includes(q)));
}

function render() {
  // 고치는 중엔 실시간 반영으로 화면을 다시 그리지 않음 (입력하던 글이 날아가지 않게)
  if (state.editing && document.getElementById('editForm')) return;
  const view = document.getElementById('view');
  const bp = document.getElementById('bulkPrint');
  if (state.tab === 'escape') {
    const n = filtered(state.escape).filter(x => hasQR(x) || x.data).length;
    bp.classList.remove('hidden'); bp.textContent = `🖨️ 보이는 학생 QR 모아 인쇄 (${n}명)`; bp.disabled = !n;
  } else bp.classList.add('hidden');
  if (state.tab === 'accounts') return renderAccounts(view);
  const arr = filtered(state.tab === 'escape' ? state.escape : withLoggedIn(state.interview));
  document.getElementById('count').textContent = `${arr.length}명`;
  if (state.sel && !arr.find(x => x.sid === state.sel)) state.sel = null;
  if (!state.sel && arr.length) state.sel = arr[0].sid;
  const cur = arr.find(x => x.sid === state.sel);

  view.innerHTML = `
    <div class="layout">
      <div class="list">${arr.length ? arr.map(x => `
        <div class="item ${x.sid === state.sel ? 'on' : ''}" onclick="pick('${esc(x.sid)}')">
          <div class="who">${esc(x.sid)} ${esc(x.name)}${groupBtns(x.sid)}</div>
          <div class="meta">${state.tab === 'escape' ? escapeMeta(x) : interviewMeta(x)}</div>
        </div>`).join('') : '<div class="empty">아직 아무도 없어요</div>'}
      </div>
      <div class="detail">${cur ? (state.tab === 'escape' ? escapeDetail(cur) : interviewDetail(cur)) : '<div class="empty">왼쪽에서 학생을 골라주세요</div>'}</div>
    </div>`;
}

function pick(sid) {
  if (!leaveEdit()) return;
  state.sel = sid; render();
}
function leaveEdit() {
  if (!state.editing) return true;
  if (!confirm('고치던 내용을 저장하지 않고 나갈까요?')) return false;
  state.editing = null; return true;
}

// ---------- 방탈출 ----------
function filledCount(d) {
  const rooms = (d && d.rooms) || [];
  return rooms.filter((r, i) => r && r.story && (i === 0 || r.question) && (i === 0 || i === 4 || r.answer)).length;
}
function escapeMeta(x) {
  const d = x.data || {};
  const a = ARTISTS[d.artist];
  return `${a ? a.emoji + ' ' : ''}${esc(d.title || '(제목 없음)')} · ${filledCount(d)}/5칸 ${hasQR(x) ? '· QR ✅' : ''} · ${fmt(x.updatedAt)}`;
}
function escapeDetail(x) {
  if (state.editing === x.sid) return escapeEditForm(x);
  const d = x.data || {};
  const a = ARTISTS[d.artist] || { emoji: '', name: d.artist || '' };
  const rooms = d.rooms || [];
  const row = (k, v, cls = '') => `<div class="row"><div class="k">${k}</div><div class="v ${cls}">${v ? esc(v) : '<span class="blank">비어 있음</span>'}</div></div>`;
  return `
    <div class="head">
      <h2>${a.emoji} ${esc(d.title || '(제목 없음)')}</h2>
      <span class="pill">${esc(x.sid)} ${esc(x.name)}</span>
      <span class="pill">${esc(a.name)}</span>
      <span class="pill ${filledCount(d) === 5 ? '' : 'gray'}">${filledCount(d)}/5칸</span>
      ${hasQR(x)
        ? `<a href="${esc(playUrl(x))}" target="_blank"><button class="ghost">👁️ 체험해보기</button></a>
           <button onclick="printOne('${esc(x.sid)}')">🖨️ QR 인쇄</button>`
        : x.data ? `<span class="pill gray">QR 아직 안 만듦</span>
           <button onclick="makeQR('${esc(x.sid)}')">🔳 QR 만들기</button>`
        : '<span class="pill gray">QR 아직 안 만듦</span>'}
      ${x.data ? `<button class="ghost" onclick="startEdit('${esc(x.sid)}')">✏️ 고치기</button>` : ''}
      ${x.teacherEditAt ? `<span class="pill gray">선생님이 고침 ${fmt(x.teacherEditAt)}</span>` : ''}
    </div>
    ${ROOM_TAGS.map((tag, i) => {
      const r = rooms[i] || {};
      return `<div class="room">
        <div class="tag">${tag}${r.name && !tag.endsWith(r.name) ? ' · ' + esc(r.name) : ''}</div>
        ${row(i === 0 ? '도입 이야기' : '방 설명', r.story)}
        ${r.image ? `<div class="row"><div class="k">사진</div><div class="v"><img src="${esc(r.image)}" onclick="lightbox(this.src)"></div></div>` : ''}
        ${i >= 1 && i <= 3 ? row('문제', r.question) + row('정답', r.answer, 'ans') + row('힌트', r.hint) + row('정답 문구', r.success) + (r.successImage ? `<div class="row"><div class="k">정답 사진</div><div class="v"><img src="${esc(r.successImage)}" onclick="lightbox(this.src)"></div></div>` : '') : ''}
        ${i === 4 ? row('마지막 질문', r.question) : ''}
      </div>`;
    }).join('')}
    ${(() => {
      const res = [...(state.responses[x.sid] || []), ...(x.eid ? state.responses[x.eid] || [] : [])];
      return `<div class="room">
        <div class="tag">💫 체험한 친구들이 마지막방에 남긴 답 (${res.length})</div>
        ${res.length ? res.map(r => `<div class="row"><div class="k">${fmt(r.at)}</div><div class="v">${esc(r.t)}</div></div>`).join('')
          : '<div class="row"><div class="k"></div><div class="v"><span class="blank">아직 없어요</span></div></div>'}
      </div>`;
    })()}
    <div style="font-size:12px; color:var(--muted); text-align:right;">마지막 저장 ${fmt(x.updatedAt)}</div>`;
}

// ---------- 인터뷰 ----------
function qCount(msgs) { return (msgs || []).filter(m => m.role === 'user').length; }
// 학생이 '대화 지우기'로 지운 대화 (작가별, 오래된 순)
function archivesOf(x, k) {
  return Object.values(x.archive || {}).filter(a => a.artist === k).sort((a, b) => a.at - b.at);
}
function totalQ(x, k) {
  return qCount((x.chats || {})[k]) + archivesOf(x, k).reduce((s, a) => s + qCount(a.msgs), 0);
}
// 로그인만 하고 아직 작가를 안 고른 학생도 목록에 보이게
function withLoggedIn(arr) {
  const has = new Set(arr.map(x => x.sid));
  const extra = state.students.filter(s => !has.has(s.sid)).map(s => ({ ...s, loginOnly: true }));
  return [...arr, ...extra].sort((a, b) => String(a.sid).localeCompare(String(b.sid)));
}
function interviewMeta(x) {
  if (x.loginOnly) return `로그인만 함 · 아직 대화 전 · ${fmt(x.updatedAt)}`;
  const parts = Object.keys(ARTISTS).filter(k => totalQ(x, k) > 0).map(k => `${ARTISTS[k].emoji}${totalQ(x, k)}`);
  return `${parts.join(' ') || '질문 없음'} · ${fmt(x.updatedAt)}`;
}
function chatHtml(msgs) {
  return `<div class="chat">${msgs.map(m => `<div class="msg ${esc(m.role)}">${esc(m.content)}</div>`).join('')}</div>`;
}
function interviewDetail(x) {
  const chats = x.chats || {};
  const used = Object.keys(ARTISTS).filter(k => totalQ(x, k) > 0);
  return `
    <div class="head">
      <h2>🎨 ${esc(x.sid)} ${esc(x.name)}</h2>
      <span class="pill">질문 ${used.reduce((s, k) => s + totalQ(x, k), 0)}개</span>
    </div>
    ${used.length ? used.map(k => `
      <div class="artist-block">
        <h3>${ARTISTS[k].emoji} ${ARTISTS[k].name} <span class="pill">질문 ${totalQ(x, k)}개</span></h3>
        ${archivesOf(x, k).map(a => `
          <div style="font-size:12px; color:var(--muted); margin:8px 0 4px;">🗑️ 학생이 지운 대화 · ${fmt(a.at)}</div>
          <div style="opacity:.75;">${chatHtml(a.msgs || [])}</div>`).join('')}
        ${qCount(chats[k]) > 0 ? `${archivesOf(x, k).length ? '<div style="font-size:12px; color:var(--muted); margin:8px 0 4px;">💬 지금 대화</div>' : ''}${chatHtml(chats[k])}` : ''}
      </div>`).join('') : '<div class="empty">아직 질문한 기록이 없어요</div>'}`;
}

// ---------- 계정 ----------
function renderAccounts(view) {
  const arr = filtered(state.students);
  document.getElementById('count').textContent = `${arr.length}명`;
  view.innerHTML = arr.length ? `
    <table>
      <tr><th>학번</th><th>이름</th><th>분반</th><th>마지막 로그인</th><th></th></tr>
      ${arr.map(s => `<tr>
        <td>${esc(s.sid)}</td><td>${esc(s.name)}</td><td>${groupBtns(s.sid)}</td><td>${fmt(s.updatedAt)}</td>
        <td><button class="ghost" onclick="renameStudent('${esc(s.sid)}')">이름 고치기</button>
          <button class="ghost" style="color:#c04040; border-color:#e8b4b4;" onclick="deleteStudent('${esc(s.sid)}')">계정 삭제</button></td>
      </tr>`).join('')}
    </table>
    <p style="font-size:12.5px; color:var(--muted); margin-top:10px;">분반은 A/E를 눌러 정해요(같은 걸 또 누르면 해제). 아트 레터에서 정한 분반이 있으면 처음부터 그대로 들어가 있어요. 학생이 처음 들어올 때 이름을 잘못 쳤다면 여기서 고쳐주세요. 고친 이름으로 다시 들어오면 돼요. 계정 삭제는 인터뷰 대화·방탈출 문제·친구들이 남긴 답까지 모두 지워요(되돌릴 수 없음).</p>` : '<div class="empty">아직 로그인한 학생이 없어요</div>';
}
// 테스트 계정 정리용: 계정과 그 학생의 기록을 모두 지움
async function deleteStudent(sid) {
  const s = state.students.find(x => x.sid === sid);
  const who = `${sid} ${s ? s.name : ''}`;
  if (!confirm(`${who} 계정을 삭제할까요?
인터뷰 대화·방탈출 문제·친구들이 남긴 답까지 모두 지워져요.`)) return;
  if (!confirm(`정말 지울까요? 되돌릴 수 없어요.
(${who})`)) return;
  try {
    const resp = await db.collection('artclass_responses').where('key', '==', sid).get();
    await Promise.all([
      ...resp.docs.map(d => d.ref.delete()),
      db.collection('artclass_escape').doc(sid).delete(),
      db.collection('artclass_interview').doc(sid).delete(),
      db.collection('artclass_settings').doc('groups').set({ map: { [sid]: firebase.firestore.FieldValue.delete() } }, { merge: true }),
    ]);
    await db.collection('artclass_students').doc(sid).delete();
  } catch (e) { console.error(e); alert('삭제하지 못했어요. 인터넷을 확인해주세요.'); }
}

async function renameStudent(sid) {
  const s = state.students.find(x => x.sid === sid);
  const name = prompt(`${sid} 학생의 이름을 무엇으로 고칠까요?`, s ? s.name : '');
  if (!name || !name.trim()) return;
  const n = name.trim();
  await db.collection('artclass_students').doc(sid).update({ name: n });
  // 이미 저장된 작업에 적힌 이름도 같이 고침
  const esc_ = db.collection('artclass_escape').doc(sid), int_ = db.collection('artclass_interview').doc(sid);
  if ((await esc_.get()).exists) await esc_.update({ name: n, 'data.maker': `${sid} ${n}` });
  if ((await int_.get()).exists) await int_.update({ name: n });
}

// ---------- QR 인쇄: 학생 한 명당 A4 한 장 (QR 3장, 시작방은 1번에 합쳐짐) ----------
// 시작방은 1번 QR에 합쳐짐 → QR 3장 (주소의 n은 1·2·3)
const QR_ROOMS = [1, 2, 3];
// ---------- 선생님이 학생 방탈출 고치기 ----------
function startEdit(sid) {
  state.editing = sid;
  const x = state.escape.find(e => e.sid === sid);
  document.querySelector('.detail').innerHTML = escapeEditForm(x);
}
function escapeEditForm(x) {
  const d = x.data || {};
  const rooms = d.rooms || [];
  const box = (ri, f, label, v, rows = 3) => `<div class="row"><div class="k">${label}</div><div class="v"><textarea class="ed" data-r="${ri}" data-f="${f}" rows="${rows}">${esc(v)}</textarea></div></div>`;
  const line = (ri, f, label, v) => `<div class="row"><div class="k">${label}</div><div class="v"><input class="ed" data-r="${ri}" data-f="${f}" value="${esc(v)}"></div></div>`;
  const recent = Date.now() - (x.updatedAt || 0) < 3 * 60 * 1000;
  return `<div id="editForm">
    <div class="head">
      <h2>✏️ ${esc(x.sid)} ${esc(x.name)} 방탈출 고치기</h2>
      <button onclick="saveEdit('${esc(x.sid)}')">💾 저장</button>
      <button class="ghost" onclick="cancelEdit()">취소</button>
    </div>
    ${recent ? `<div class="edit-warn">⚠️ 이 학생이 ${fmt(x.updatedAt)}에 작업했어요. 학생이 지금도 고치고 있으면 선생님이 고친 내용과 엇갈릴 수 있으니, 잠깐 멈추게 한 뒤 저장해 주세요.</div>` : ''}
    <div class="edit-note">저장하면 체험 화면(QR)에 바로 반영되고, 학생 화면도 고친 내용으로 바뀌어요. 정답이 여러 개면 / 로 나눠요.</div>
    <div class="room">${line(-1, 'title', '방탈출 제목', d.title)}</div>
    ${ROOM_TAGS.map((tag, i) => {
      const r = rooms[i] || {};
      return `<div class="room">
        <div class="tag">${tag}</div>
        ${box(i, 'story', i === 0 ? '도입 이야기' : '방 설명', r.story, 4)}
        ${i >= 1 && i <= 3 ? box(i, 'question', '문제', r.question) + line(i, 'answer', '정답', r.answer) + box(i, 'hint', '힌트', r.hint, 2) + box(i, 'success', '정답 문구', r.success, 2) : ''}
        ${i === 4 ? box(i, 'question', '마지막 질문', r.question, 2) : ''}
      </div>`;
    }).join('')}
    <div style="text-align:right;"><button onclick="saveEdit('${esc(x.sid)}')">💾 저장</button></div>
  </div>`;
}
function cancelEdit() {
  if (!leaveEdit()) return;
  render();
}
async function saveEdit(sid) {
  const x = state.escape.find(e => e.sid === sid);
  if (!x || !x.data) return;
  const d = JSON.parse(JSON.stringify(x.data));
  d.rooms = d.rooms || [];
  document.querySelectorAll('#editForm .ed').forEach(inp => {
    const ri = Number(inp.dataset.r), f = inp.dataset.f;
    if (ri < 0) d[f] = inp.value;
    else { d.rooms[ri] = d.rooms[ri] || { idx: ri }; d.rooms[ri][f] = inp.value; }
  });
  const now = Date.now();
  const update = { data: d, updatedAt: now, teacherEditAt: now };
  if (x.published) update.published = d;   // 이미 QR을 만든 학생은 체험 화면에도 바로 반영
  try {
    await db.collection('artclass_escape').doc(sid).set(update, { merge: true });
    state.editing = null;
    render();
  } catch (e) {
    console.error(e); alert('저장하지 못했어요. 인터넷을 확인하고 다시 눌러주세요.');
  }
}

const QR_LABELS = ['1번 문제 · 입구', '2번 문제', '3번 문제'];
function printOne(sid) {
  const x = state.escape.find(e => e.sid === sid);
  if (!x) return;
  pickPrintSize(`${x.sid} ${x.name} 학생의 QR을 인쇄해요.`).then(size => { if (size) printQRPages([x], size); });
}
// QR 크기 고르기: 'big' = 학생당 한 장(6.2cm), 숫자 = QR 한 변 mm (여러 학생을 한 장에)
function pickPrintSize(msg) {
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'size-pick';
    wrap.innerHTML = `<div class="box">
      <p>${esc(msg)}\nQR 크기를 골라주세요.</p>
      <div class="opts">
        <button data-s="10">1cm<small>한 장에 가장 많이</small></button>
        <button data-s="15">1.5cm</button>
        <button data-s="20">2cm</button>
        <button data-s="big" class="ghost">크게 6cm<small>학생당 한 장</small></button>
      </div>
      <button class="ghost" data-s="" style="width:100%;">취소</button>
    </div>`;
    wrap.onclick = e => {
      const b = e.target.closest('button');
      if (!b && e.target !== wrap) return;
      wrap.remove();
      const s = b ? b.dataset.s : '';
      resolve(s === 'big' ? 'big' : s ? Number(s) : null);
    };
    document.body.appendChild(wrap);
  });
}
// 학생이 "QR 생성"을 안 눌렀어도 선생님이 대신 만듦 (학생이 누른 것과 똑같이 published 저장)
// 학생 화면은 published가 생긴 걸 보고 qrMade를 켜서, 이후 고치는 내용도 체험 화면에 반영됨
async function publishFor(x) {
  const d = JSON.parse(JSON.stringify(x.data));
  d.qrMade = true;
  await db.collection('artclass_escape').doc(x.sid).set({ data: d, published: d }, { merge: true });
  x.data = d; x.published = d;
}
async function makeQR(sid) {
  const x = state.escape.find(e => e.sid === sid);
  if (!x || !x.data) return;
  if (!confirm(`${x.sid} ${x.name} 학생의 QR을 대신 만들까요?\n지금까지 저장된 내용으로 체험할 수 있게 되고, 학생이 이어서 고치는 내용도 바로 반영돼요.`)) return;
  try { await publishFor(x); render(); }
  catch (e) { console.error(e); alert('QR을 만들지 못했어요. 인터넷을 확인해주세요.'); }
}
async function printFiltered() {
  const all = filtered(state.escape);
  const missing = all.filter(x => !hasQR(x) && x.data);
  const list = all.filter(x => hasQR(x) || x.data);
  if (!list.length) return;
  const size = await pickPrintSize(`${list.length}명의 QR을 인쇄해요.` +
    (missing.length ? `\n(아직 "QR 생성"을 누르지 않은 ${missing.length}명은 선생님이 대신 만들어서 같이 인쇄해요)` : ''));
  if (!size) return;
  try { for (const x of missing) await publishFor(x); }
  catch (e) { console.error(e); alert('QR을 만들지 못했어요. 인터넷을 확인해주세요.'); return; }
  printQRPages(list, size);
}
async function printQRPages(list, size = 'big') {
  if (!window.QRCodeStyling) { alert('QR 도구를 불러오지 못했어요. 새로고침 후 다시 해주세요.'); return; }
  const busy = document.createElement('div');
  busy.className = 'print-busy'; busy.textContent = 'QR 준비 중...';
  document.body.appendChild(busy);
  const area = document.getElementById('printArea');
  const small = size !== 'big';
  area.style.removeProperty('--q'); area.style.removeProperty('--cap');
  if (small) {
    // 작은 QR: 학생마다 [학번 이름] 아래 QR 3개 한 줄, 칸마다 "학번-번호" (잘라도 누구 건지 알게)
    area.style.setProperty('--q', size + 'mm');
    area.style.setProperty('--cap', ({ 10: 5, 15: 6, 20: 7 }[size] || 6) + 'pt');
    area.innerHTML = `<div class="ps-wrap">${list.map((x, i) => `
      <div class="ps">
        <div class="ps-h">${esc(x.sid)} ${esc(x.name)}</div>
        <div class="ps-row">${QR_ROOMS.map(n => `
          <div class="ps-c"><div id="pq-${i}-${n}"></div><div class="cap">${esc(x.sid)}-${n}</div></div>`).join('')}
        </div>
      </div>`).join('')}</div>`;
  } else area.innerHTML = list.map((x, i) => {
    const d = x.published || x.data || {};
    const a = ARTISTS[d.artist] || { name: '' };
    const rooms = d.rooms || [];
    return `<div class="pp">
      <div class="pp-head">
        <div class="t">${esc(d.title || '(제목 없음)')}</div>
        <div class="m">${esc(x.sid)} ${esc(x.name)}<br>${esc(a.name)}</div>
      </div>
      <div class="pp-grid">${QR_ROOMS.map((n, k) => { const lb = QR_LABELS[k]; return `
        <div class="pp-cell">
          <div class="lb">${lb}</div>
          <div class="sub">${rooms[n] && rooms[n].name && !lb.startsWith(rooms[n].name) ? esc(rooms[n].name) : '&nbsp;'}</div>
          <div id="pq-${i}-${n}"></div>
        </div>`; }).join('')}
      </div>
      <div class="pp-foot">점선을 따라 잘라 미니어처의 각 자리에 붙이세요. 1번 QR은 입구에 — 시작방 이야기가 먼저 나와요. 마지막방은 QR이 없어요. 3번 문제를 맞히면 이어져요.</div>
    </div>`;
  }).join('');
  // QR은 하나씩 이미지로 완성한 뒤 붙임 (숨긴 영역에 바로 그리면 빈 그림이 되는 문제)
  try {
    for (let i = 0; i < list.length; i++) {
      for (const n of QR_ROOMS) {
        busy.textContent = `QR 준비 중... (${i + 1}/${list.length}명)`;
        const qr = new QRCodeStyling({
          // 인쇄용은 반듯한 네모 모양 (작게 뽑아도 잘 읽히게)
          // 작은 QR은 오류보정 L(칸 수가 줄어 점이 굵어짐), 흰 여백은 인쇄 칸 안쪽 여백으로 대신
          width: 600, height: 600, type: 'canvas', data: playUrl(list[i], n), margin: small ? 0 : 12,
          qrOptions: { errorCorrectionLevel: small ? 'L' : 'M' },
          dotsOptions: { color: '#000000', type: 'square' },
          cornersSquareOptions: { color: '#000000', type: 'square' },
          cornersDotOptions: { color: '#000000', type: 'square' },
          backgroundOptions: { color: '#ffffff' },
        });
        const blob = await qr.getRawData('png');
        const img = new Image();
        img.src = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
        // 그림이 완전히 그려진 다음에 붙임 (안 그러면 마지막 QR이 빈 채로 인쇄 창이 열림)
        await img.decode().catch(() => new Promise(r => { if (img.complete) r(); else img.onload = img.onerror = r; }));
        img.className = 'pq';
        document.getElementById(`pq-${i}-${n}`).appendChild(img);
      }
    }
  } catch (e) {
    busy.remove(); alert('QR을 만들지 못했어요. 새로고침 후 다시 해주세요.'); return;
  }
  busy.remove();
  // 붙인 QR이 화면에 다 자리 잡을 때까지 잠깐 기다린 뒤 인쇄
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(r, 300))));
  window.print();
}

function lightbox(src) {
  const box = document.createElement('div');
  box.className = 'lightbox';
  box.innerHTML = `<img src="${esc(src)}">`;
  box.onclick = () => box.remove();
  document.body.appendChild(box);
}
