<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>작가 방탈출 완성 예시</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --main: #8ab861; --accent: #f0c850; --soft: #f5f9f0; --text: #3a4a2e; --muted: #7a8a66; --line: #e3edd4; }
body { font-family: 'Noto Sans KR', sans-serif; background: #f5f9f0; color: var(--text); line-height: 1.7; padding: 20px 16px 40px; }
.wrap { max-width: 820px; margin: 0 auto; }
h1, h2, h3 { font-family: 'Gaegu', sans-serif; }

.top { background: #fff; border-radius: 18px; padding: 22px 26px; margin-bottom: 14px; box-shadow: 0 4px 16px rgba(120,160,90,.1); }
.top h1 { font-size: 30px; color: #5a7738; }
.top p { font-size: 14px; color: var(--muted); }
.top .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
a.btn, button { font-family: inherit; font-size: 13px; font-weight: 500; padding: 8px 14px; border-radius: 10px; border: 1.5px solid #8ab861; background: #fff; color: #5a7738; cursor: pointer; text-decoration: none; }
button.on { background: var(--c, #8ab861); border-color: var(--c, #8ab861); color: #fff; }

.tips { background: #fffbe8; border-left: 4px solid var(--accent); border-radius: 10px; padding: 14px 18px; margin-bottom: 14px; font-size: 14px; }
.tips b { color: #8a6a1a; }
.tips ul { padding-left: 18px; margin-top: 6px; }
.tips li { margin-bottom: 3px; }

.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }

.sample { background: #fff; border-radius: 18px; padding: 24px 26px; box-shadow: 0 4px 16px rgba(120,160,90,.1); border-top: 6px solid var(--c); }
.sample + .sample { margin-top: 18px; }
.sample .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.sample .head h2 { font-size: 30px; color: var(--c); }
.sample .head .artist { font-size: 13px; color: var(--muted); }

.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); margin: 10px 0 18px; }
.flow span.step { background: var(--soft); border: 1px solid var(--line); border-radius: 20px; padding: 2px 10px; color: var(--text); }
.flow span.step.noqr { border-style: dashed; }

.room { border: 1.5px solid var(--line); border-radius: 14px; padding: 14px 18px; margin-bottom: 12px; break-inside: avoid; }
.room .tag { display: inline-block; background: var(--c); color: #fff; font-size: 12.5px; font-weight: 700; padding: 3px 12px; border-radius: 20px; margin-bottom: 6px; }
.room .tag .qr { opacity: .8; font-weight: 400; margin-left: 4px; }
.room .name { font-family: 'Gaegu', sans-serif; font-size: 22px; color: var(--c); margin-left: 6px; }
.field { margin-top: 10px; }
.field .k { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 2px; }
.field .v { font-size: 14.5px; white-space: pre-wrap; word-break: keep-all; background: var(--soft); border-radius: 8px; padding: 8px 12px; }
.field .v.answer { display: inline-block; font-weight: 700; color: #b06a10; background: #fff4dc; }
.field .v.question { border-left: 3px solid var(--c); }
.arrow { text-align: center; font-size: 12.5px; color: var(--muted); margin: -4px 0 8px; }

footer { text-align: center; margin-top: 26px; font-size: 12px; color: var(--muted); }

@media print {
  body { background: #fff; padding: 0; }
  .noprint { display: none !important; }
  .sample { box-shadow: none; display: block !important; border: 1px solid #ddd; border-top: 6px solid var(--c); }
  .sample + .sample { break-before: page; margin-top: 0; }
  .field .v { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .room .tag, .sample { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>작가 방탈출 완성 예시</h1>
    <p>문제 제작 사이트의 칸 순서 그대로 정리했어요. 내 방탈출을 구상할 때 참고하세요.</p>
    <div class="btns noprint">
      <a class="btn" href="./">문제 만들러 가기</a>
      <button onclick="printAll()">인쇄 / PDF 저장</button>
    </div>
  </div>

  <div class="tips">
    <b>예시에서 눈여겨볼 점</b>
    <ul>
      <li>문제 끝에 정답 글자 수를 적어 두었어요. 예: (두 글자)</li>
      <li>힌트는 정답을 그대로 말하지 않고, 빈칸(___)이나 찾을 방향만 알려줘요.</li>
      <li>정답 맞힌 후 문구에는 그 정답과 관련된 작가 이야기를 한두 문장으로 담았어요.</li>
      <li>마지막 질문은 정답이 없어요. 체험자가 자기 이야기로 한 줄 답하는 질문이에요.</li>
    </ul>
  </div>

  <div class="tabs noprint" id="tabs"></div>
  <div id="samples"></div>

  <footer>작가의 세계를 탐험하다: 미술 방탈출 프로젝트</footer>
</div>

<script>

// 문제 제작 사이트(index.html)의 SAMPLES와 같은 내용 — 예시를 고치면 여기도 같이 고치기

당신 차례입니다.`,

const TAGS = ['시작방', '1번 문제', '2번 문제', '3번 문제', '마지막방'];

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const field = (k, v, cls = '') => v ? `<div class="field"><div class="k">${k}</div><div class="v ${cls}">${esc(v)}</div></div>` : '';

function renderSample(key, s) {
  const p = ARTIST_PRESETS[key];
  const rooms = s.rooms.map((r, i) => {
    const qr = i < 4 ? `QR ${i + 1}` : 'QR 없음';
    let body = '';
    if (i === 0) {
      body = field('도입 이야기 (플레이어의 역할 + 첫 방의 분위기)', r.story);
    } else if (i <= 3) {
      body = field('방 설명 · 연출 · 분위기', r.story)
        + field('질문 / 수수께끼', r.question, 'question')
        + `<div class="field"><div class="k">정답</div><div class="v answer">${esc(r.answer)}</div></div>`
        + field('힌트', r.hint)
        + field('정답 맞힌 후 보여줄 문구', r.success);
    } else {
      body = field('방 설명 · 연출 · 분위기', r.story)
        + field('마지막 질문 (체험자가 자기 이야기로 답을 남겨요)', r.question, 'question');
    }
    const arrow = i === 3 ? '<div class="arrow">3번 문제를 맞히면 QR 없이 마지막방으로 이어져요</div>' : '';
    return `<div class="room">
        <span class="tag">${TAGS[i]}<span class="qr">· ${qr}</span></span>
        ${r.name && r.name !== TAGS[i] ? `<span class="name">${esc(r.name)}</span>` : ''}
        ${body}
      </div>${arrow}`;
  }).join('');
  return `<section class="sample" id="s-${key}" style="--c:${p.mainColor}">
      <div class="head"><h2>${esc(s.title)}</h2><span class="artist">${p.name} (${p.years})</span></div>
      <div class="flow">
        ${TAGS.map((t, i) => `<span class="step ${i === 4 ? 'noqr' : ''}">${t}</span>`).join(' → ')}
      </div>
      ${rooms}
    </section>`;
}

const keys = Object.keys(SAMPLES);
let current = keys[0];
function show(key) {
  current = key;
  document.querySelectorAll('.sample').forEach(el => el.style.display = el.id === 's-' + key ? '' : 'none');
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.k === key));
}
function printAll() {
  // 인쇄할 때는 세 예시를 모두 (한 장에 하나씩)
  document.querySelectorAll('.sample').forEach(el => el.style.display = '');
  window.print();
  show(current);
}

document.getElementById('samples').innerHTML = keys.map(k => renderSample(k, SAMPLES[k])).join('');
document.getElementById('tabs').innerHTML = keys.map(k =>
  `<button data-k="${k}" style="--c:${ARTIST_PRESETS[k].mainColor}" onclick="show('${k}')">${ARTIST_PRESETS[k].name} · ${esc(SAMPLES[k].title)}</button>`
).join('');
show(keys[0]);
</script>
</body>
</html>
